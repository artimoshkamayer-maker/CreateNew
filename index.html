<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121016">
<meta name="mobile-web-app-capable" content="yes">
<title>Artimoshka mp3 - mp4</title>

<body>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#121016;--bg2:#1c1922;--card:#211e29;--card2:#282434;--txt:#fff;--mut:#a7a1b8;--acc:#0b84ff;--acc2:#00c9ff;--line:rgba(255,255,255,.08);--r:16px}
body.light{--bg:#f4f2f7;--bg2:#fff;--card:#fff;--card2:#efeaf5;--txt:#16121d;--mut:#6f6880;--line:rgba(0,0,0,.08)}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,Arial;text-align:left;user-select:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:150px}
header.top{position:static;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);padding:14px 16px 8px}
.logoRow{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#00c9ff);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px rgba(11,132,255,.4)}
.logoRow b{font-size:19px;letter-spacing:.2px}.logoRow b span{color:var(--acc)}
.logoRow .sub{font-size:11px;color:var(--mut);margin-top:-3px}
.icobtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--txt);font-size:18px;cursor:pointer;display:grid;place-items:center}
.icobtn:active{transform:scale(.93)}
.search{margin:10px 0 4px;display:flex;gap:8px}
.search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--txt);outline:none;font-size:14px}
.search input:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;text-align:center;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sec{padding:6px 16px}
.sec h3{margin:14px 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.sec h3 small{color:var(--mut);font-weight:400;font-size:12px;cursor:pointer}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.bigcard{flex:0 0 84px;height:106px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.bigcard .cv{position:absolute;inset:0;width:auto;height:auto;border-radius:0;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff}
.bigcard .mt{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:none}
.bigcard .mt b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bigcard .mt span{font-size:10px;color:#cfc9dd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0;cursor:pointer}
.row:active{transform:scale(.99)}
.row.playing{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cv{width:52px;height:52px;border-radius:12px;flex:0 0 52px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff}
.row .tt{flex:1;min-width:0}.row .tt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .tt span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .dur{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.acard .cv{width:48px;height:48px}
.acard b{display:block;font-size:13px}.acard span{font-size:12px;color:var(--mut)}
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;width:min(520px,calc(100% - 16px));background:var(--card2);border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.4);cursor:pointer}
#mini .cv{width:48px;height:48px}
#mini .tt{flex:1;min-width:0}#mini .tt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini .tt span{font-size:11px;color:var(--mut)}
#miniBar{position:absolute;left:12px;right:12px;bottom:4px;height:3px;background:rgba(128,128,128,.3);border-radius:99px;overflow:hidden}
#miniBar i{display:block;height:100%;background:var(--acc);width:0}
#mini[hidden]{display:none}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;z-index:40;padding:0 4px 4px}
nav.tabs button{flex:1;border:0;background:none;color:var(--mut);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:4px}
nav.tabs button span.i{font-size:17px}
nav.tabs button.on{color:var(--acc);font-weight:700}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .pn{position:relative;width:min(520px,100%);max-height:92vh;overflow-y:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:10px 16px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:6px auto 12px}
#full .cover{width:min(300px,70vw);aspect-ratio:1;border-radius:24px;margin:8px auto;display:grid;place-items:center;font-size:90px;font-weight:800;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;overflow:hidden}
#full h2{margin:12px 0 0;font-size:20px;text-align:center}
#full .art{text-align:center;color:var(--mut);font-size:14px}
#viz{width:100%;height:64px;display:block;margin:6px 0}
input[type=range].seek{width:100%;accent-color:var(--acc)}
.trow{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.cbtn{border:0;background:var(--card);color:var(--txt);cursor:pointer;border-radius:50%;width:52px;height:52px;font-size:22px;display:grid;place-items:center}
.cbtn.big{width:72px;height:72px;font-size:30px;background:var(--acc);color:#000;box-shadow:0 10px 26px rgba(11,132,255,.45)}
.cbtn.sm{width:44px;height:44px;font-size:17px;background:none;color:var(--mut)}
.cbtn.sm.on{color:var(--acc)}
.abtn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;padding:10px;font-size:13px;cursor:pointer}
.eqband{display:flex;gap:8px;justify-content:space-between;margin:10px 0}
.eqband .b{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.eqband input{writing-mode:vertical-lr;direction:rtl;height:110px;accent-color:var(--acc)}
.eqband small{font-size:10px;color:var(--mut)}.eqband b{font-size:11px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets .chip.on{outline:2px solid #fff3}
.kv{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.kv label{flex:1;font-size:13px}.kv label small{display:block;color:var(--mut);font-size:11px}
.kv input[type=range]{width:130px;accent-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.lyr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-line;font-size:13px;max-height:260px;overflow-y:auto}
.lyr .hl{color:var(--acc);font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#000;color:#fff;padding:10px 16px;border-radius:99px;z-index:99;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:20px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.themeDot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.themeDot.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.eqhead{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.eqico{width:48px;height:48px;flex:0 0 48px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:23px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#eqTopBtn{background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.vwrap{background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.vwrap video{display:block}
.vctrl{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#000}
.vctrl span{font-size:12px;color:#fff;min-width:36px;text-align:center}
.vctrl .seek{flex:1}
.vctrl .icobtn{width:36px;height:36px;font-size:15px;flex:0 0 36px;background:transparent;border:0;color:#fff}
#vidRot{margin-right:-6px}
#vidRep{margin-right:-6px}
#vidMute{margin-right:-7px}
.rep1{position:absolute;left:50%;top:50%;transform:translate(-50%,-45%);font-size:8px;font-weight:800;background:var(--acc);color:#fff;border-radius:5px;padding:0 3px;line-height:1.5;pointer-events:none}
.vwrap:fullscreen{border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center}
.vwrap:fullscreen #vidEl{max-height:100vh;border-radius:0}
body.custom-bg{background-size:cover;background-position:center;background-attachment:fixed;background-color:#0a0a10}
body.clear-glass{text-shadow:0 1px 10px rgba(0,0,0,.9)}
body.clear-glass #app,body.clear-glass header.top,body.clear-glass .row,body.clear-glass .bigcard,body.clear-glass .acard,body.clear-glass .chip,body.clear-glass .kv,body.clear-glass .btn.ghost,body.clear-glass .abtn,body.clear-glass .icobtn,body.clear-glass .cbtn:not(.big),body.clear-glass .search input,body.clear-glass .eqband .b,body.clear-glass .lyr,body.clear-glass .sheet .pn,body.clear-glass nav.tabs,body.clear-glass #mini,body.clear-glass .fx{background:transparent!important;border-color:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.clear-glass .sheet .bk{background:rgba(0,0,0,.25)}
body.clear-glass .chip.on{background:var(--acc)!important;border-color:var(--acc)!important}
body.clear-glass .row.playing{border-color:var(--acc)!important}
body.clear-glass .grab{background:rgba(255,255,255,.35)}
body.clear-glass .cv,body.clear-glass .logo,body.clear-glass .cbtn.big,body.clear-glass .eqico,body.clear-glass .toast{text-shadow:none}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.vtile{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/10;border:1px solid var(--line);cursor:pointer}
.vtile video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.vtile .vph{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--card),var(--card2))}
.vtile .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.9);color:#fff;display:grid;place-items:center;font-size:16px;pointer-events:none}
.vtile .vname{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.vtile .vdur{position:absolute;left:6px;top:6px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:7px;padding:2px 7px;pointer-events:none}
.vtile .vdel{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:13px}
.eqhead b{font-size:16px}.eqhead small{font-size:11px;color:var(--mut)}
.mswitch{position:relative;width:42px;height:25px;flex:0 0 42px;display:block}
.mswitch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.mswitch i{position:absolute;inset:0;background:rgba(128,128,128,.35);border-radius:99px;transition:.2s}
.mswitch i:after{content:'';position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mswitch input:checked+i{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.mswitch input:checked+i:after{transform:translateX(17px)}
.presets{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;flex-wrap:nowrap}
.presets::-webkit-scrollbar{display:none}
.preset{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;transition:.15s}
.preset.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(11,132,255,.45)}
.eqband{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.bnd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 2px 8px;text-align:center;transition:.2s}
.bnd.hot{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 6px 16px rgba(11,132,255,.25)}
.bnd .v{display:block;font-size:11px;font-weight:800;color:var(--acc);margin-bottom:4px}
.bnd input{writing-mode:vertical-lr;direction:rtl;height:104px;width:100%;accent-color:var(--acc);cursor:pointer;background:transparent}
.bnd small{font-size:10px;color:var(--mut)}
.fx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.fx-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.fx-top label{flex:1;font-size:13px}
.fx-top small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.fx .val{font-size:12px;font-weight:800;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:4px 10px;min-width:56px;text-align:center}
input[type=range].mx{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:rgba(128,128,128,.3);outline:none;cursor:pointer}
input[type=range].mx::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:6px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:pointer}
input[type=range].mx::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:5px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13px}
dialog{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:400px}
dialog input{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;width:100%;margin:6px 0}
</style>

<div id="app">
<header class="top">
<div class="logoRow">
<div class="logo">🎧</div>
<div style="flex:1"><b>Artimoshka <span>mp3 - mp4</span></b></div>
<button class="icobtn" id="eqTopBtn" title="Эквалайзер"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="3" x2="6" y2="9"/><line x1="6" y1="15" x2="6" y2="21"/><circle cx="6" cy="12" r="2.5" fill="currentColor" stroke="none"/><line x1="12" y1="3" x2="12" y2="5"/><line x1="12" y1="11" x2="12" y2="21"/><circle cx="12" cy="8" r="2.5" fill="currentColor" stroke="none"/><line x1="18" y1="3" x2="18" y2="12"/><line x1="18" y1="18" x2="18" y2="21"/><circle cx="18" cy="15" r="2.5" fill="currentColor" stroke="none"/></svg></button>
</div>
<div class="search"><input id="qInput" data-i18n-ph="searchPh" placeholder="Поиск: песня, артист, альбом…"><button class="icobtn" id="addFilesBtn">＋</button></div>
<input type="file" id="fileInput" accept=".mp3,audio/mpeg" multiple hidden>
<input type="file" id="dirInput" webkitdirectory multiple hidden>
</header>
<div class="chips" id="libChips"></div>
<div id="libEl"></div>
</div>

<div id="mini" hidden>
<div class="cv" id="miniCv">♪</div>
<div class="tt"><b id="miniT">—</b><span id="miniA">—</span></div>
<button class="icobtn" id="miniPrev">⏮</button>
<button class="icobtn" id="miniPlay" style="background:var(--acc);color:#000">▶</button>
<button class="icobtn" id="miniNext">⏭</button>
<div id="miniBar"><i></i></div>
</div>

<nav class="tabs" id="tabsEl"></nav>

<div class="sheet" id="full" hidden><div class="bk"></div><div class="pn">
<div class="grab"></div>
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="icobtn" id="fullClose">﹀</button>
<span style="font-size:12px;color:var(--mut)" id="fullSrc" data-i18n="nowPlaying">СЕЙЧАС ИГРАЕТ</span>
<button class="icobtn" id="fullMore">⋮</button>
</div>
<div class="cover" id="fullCv">♪</div>
<h2 id="fullT">—</h2><div class="art" id="fullA">—</div>
<canvas id="viz" width="440" height="64"></canvas>
<input type="range" class="seek" id="seekEl" value="0" min="0" max="1000">
<div class="trow"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
<div class="ctrl">
<button class="cbtn sm" id="shufBtn" title="Shuffle">🔀</button>
<button class="cbtn" id="prevBtn">⏮</button>
<button class="cbtn big" id="playBtn">▶</button>
<button class="cbtn" id="nextBtn">⏭</button>
<button class="cbtn sm" id="repBtn" title="Repeat">🔁</button>
</div>
<div id="queueBox" hidden style="margin-top:10px"></div>
<div id="cutBox" hidden style="margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px">
<b data-i18n="cutter">✂️ Резак рингтонов</b>
<div class="trow" style="margin-top:8px"><span><span data-i18n="start">Начало: </span><b id="cutS_L">0:00</b></span><span><span data-i18n="end">Конец: </span><b id="cutE_L">0:30</b></span></div>
<input type="range" class="seek" id="cutS" min="0" max="1000" value="0"><input type="range" class="seek" id="cutE" min="0" max="1000" value="300">
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost" id="cutPrev" style="flex:1" data-i18n="preview">▶ прослушать</button><button class="btn" id="cutSave" style="flex:1" data-i18n="saveWav">⬇ сохранить .wav</button></div>
</div>
</div></div>

let idb=null;
function db(){return new Promise(res=>{if(idb)return res(idb);const r=indexedDB.open('audify',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null)})}
async function dbPut(id,blob){const d=await db();if(!d)return;await new Promise(r=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(blob,id);t.oncomplete=r;t.onerror=r})}
async function dbGet(id){const d=await db();if(!d)return null;return new Promise(r=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}
async function dbDel(id){const d=await db();if(!d)return;await new Promise(r=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=r;t.onerror=r})}

const isRemote=u=>/^https?:/i.test(u||'');
function AU(){const t=(typeof cur==='function')?cur():null;return (t&&isRemote(t.url))?auNet:au}
let AC=null,nodes=null,mediaSrc=null;
function audioGraph(){
if(AC)return;
try{
AC=new (window.AudioContext||window.webkitAudioContext)();
mediaSrc=AC.createMediaElementSource(au);
const bands=[60,230,910,3600,14000].map(f=>{const b=AC.createBiquadFilter();b.type='peaking';b.frequency.value=f;b.Q.value=1;return b});
const bass=AC.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=120;
const pre=AC.createGain(),wet=AC.createGain(),dry=AC.createGain();
const conv=AC.createConvolver();conv.buffer=impulse(2.2,2.5);
const dly=AC.createDelay(0.05);dly.delayTime.value=0.012;
const dGain=AC.createGain();dGain.gain.value=0;
const an=AC.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.82;
let head=mediaSrc;
const chain=[pre,...bands,bass];
head.connect(chain[0]);
chain.reduce((a,b)=>{a.connect(b);return b});
let tail=bass;
tail.connect(dry);dry.connect(an);
tail.connect(conv);conv.connect(wet);wet.connect(an);
tail.connect(dly);dly.connect(dGain);dGain.connect(an);
an.connect(AC.destination);
nodes={bands,bass,pre,wet,dry,dGain,an};
applyEQ();

function impulse(dur,decay){const r=AC.sampleRate,l=r*dur,b=AC.createBuffer(2,l,r);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,decay)}return b}

function paintRange(el){const min=+el.min||0,max=+el.max||0,v=+el.value||0;const p=max>min?((v-min)/(max-min)*100):0;el.style.background=`linear-gradient(90deg,var(--acc) ${p}%,rgba(128,128,128,.28) ${p}%)`}

function applyTheme(){
document.body.classList.toggle('light',S.theme==='light');
if(S.theme==='custom'){const r=document.documentElement.style;r.setProperty('--bg','rgba(8,8,14,.5)');r.setProperty('--bg2','rgba(22,20,30,.68)');r.setProperty('--card','rgba(34,31,46,.6)');r.setProperty('--card2','rgba(44,40,58,.62)');document.body.classList.add('custom-bg');document.body.classList.remove('clear-glass');document.body.style.backgroundImage=_bgUrl?`url("${_bgUrl}")`:''}
else{document.body.classList.remove('custom-bg');document.body.style.backgroundImage='';document.body.classList.toggle('clear-glass',S.theme==='clear');if(S.theme==='amoled'){document.documentElement.style.setProperty('--bg','#000');document.documentElement.style.setProperty('--bg2','#000');document.documentElement.style.setProperty('--card','#0a0a0c');document.documentElement.style.setProperty('--card2','#111')}
else{if(S.theme==='clear'){const r=document.documentElement.style;r.setProperty('--bg','transparent');r.setProperty('--bg2','transparent');r.setProperty('--card','transparent');r.setProperty('--card2','transparent');document.body.style.background='transparent'}
else{document.documentElement.style.setProperty('--bg',S.theme==='light'?'#f4f2f7':'#121016');document.documentElement.style.setProperty('--bg2',S.theme==='light'?'#fff':'#1c1922');document.documentElement.style.setProperty('--card',S.theme==='light'?'#fff':'#211e29');document.documentElement.style.setProperty('--card2',S.theme==='light'?'#efeaf5':'#282434');if(S.theme!=='custom')document.body.style.background='';}}}
document.documentElement.style.setProperty('--acc',S.acc);document.documentElement.style.setProperty('--acc2',S.acc);
document.querySelectorAll('[data-th]').forEach(b=>b.style.outline=b.dataset.th===S.theme?'2px solid var(--acc)':'none');
document.querySelectorAll('#accEl .themeDot').forEach(d=>d.classList.toggle('on',d.dataset.a===S.acc));
}

async function addFiles(list,folderHint){
let n=0;
for(const f of list){
if(!/audio\/mpe?g|\.mp3/i.test(f.type+' '+f.name))continue;
const id=uid();await dbPut(id,f);
const url=URL.createObjectURL(f);
const base=f.name.replace(/\.[^.]+$/,'');
let title=base,artist=T('unkArtist');const m=base.match(/(.+?)\s*[-–—]\s*(.+)/);if(m){artist=m[1].trim();title=m[2].trim()}
const meta={id,title,artist,album:folderHint||T('myMus'),genre:T('myMus'),url,dur:0,folder:folderHint||T('myMus'),lyrics:LYR(title,artist)};
try{meta.dur=await new Promise(r=>{const a=new Audio();a.preload='metadata';a.src=url;a.onloadedmetadata=()=>r(a.duration||0);a.onerror=()=>r(0);setTimeout(()=>r(0),8000)})}catch(e){}
S.lib.push(meta);
try{await root?.kv?.audify?.set(id,{meta:{...meta,url:''}})}catch(e){}
n++;}
save();renderAll();toast(n?T('added')+n+' 🎶':T('noAudio'))}

async function dlRingtone(t,s=0,e=30){
if(!t)return toast(T('noTrack'));
try{
toast(T('cutting'));
const buf=await fetch(t.url).then(r=>r.arrayBuffer()).catch(()=>null);
if(!buf)return toast(T('noCut'));
const C=new (window.AudioContext||window.webkitAudioContext)();
const ab=await C.decodeAudioData(buf.slice(0));
const d=Math.max(1,Math.min((e-s)||30,120));
const off=Math.max(0,s||0);
const oc=new OfflineAudioContext(Math.min(2,ab.numberOfChannels),Math.floor(ab.sampleRate*d),ab.sampleRate);
const src=oc.createBufferSource();src.buffer=ab;src.connect(oc.destination);src.start(0,Math.min(off,ab.duration-1),d);
const rb=await oc.startRendering();
const blob=bufToWav(rb);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=t.title+'-ringtone.wav';a.click();
toast(T('ringSaved'));
}catch(err){toast(T('cutFail'))}}
function bufToWav(b){const n=b.length,ch=Math.min(2,b.numberOfChannels),sr=b.sampleRate;const bytes=44+n*ch*2;const ab=new ArrayBuffer(bytes);const v=new DataView(ab);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
ws(0,'RIFF');v.setUint32(4,bytes-8,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const s=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2}
return new Blob([ab],{type:'audio/wav'})}

const vc=$('viz').getContext('2d');
const VN=32,VL=new Float32Array(VN),VP=new Float32Array(VN),VF=new Float32Array(VN).fill(.3);
const _vd=new Uint8Array(128);
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function drawViz(){
const W=440,H=64,n=VN,w=W/n,tm=performance.now()/1000;
const live=nodes&&!AU().paused;
let tgt=VF;
if(nodes&&AU()!==auNet&&live){const an=nodes.an;const d=_vd.subarray(0,an.frequencyBinCount);an.getByteFrequencyData(d);const L=d.length;
for(let i=0;i<n;i++){const f=Math.pow(i/n,1.5)*L*.75;const i0=Math.floor(f),fr=f-i0;const a=d[i0]/255,b=d[Math.min(L-1,i0+1)]/255;tgt[i]=Math.pow(a+(b-a)*fr,1.3)}}
else if(AU()===auNet&&live){for(let i=0;i<n;i++){const p=i/(n-1);const goal=.55-.4*p+.22*Math.sin(tm*2.1+i*.55)+.13*Math.sin(tm*4.7+i*1.4+p*3)+.08*Math.sin(tm*9+i*2.6);VF[i]+=(goal-VF[i])*.25;const sway=1+.18*Math.sin(tm*5.3+p*6);tgt[i]=Math.max(.04,VF[i]*sway)}}
else{for(let i=0;i<n;i++)tgt[i]=.035+.02*Math.sin(tm*1.2+i*.5)}
vc.clearRect(0,0,W,H);
const g=vc.createLinearGradient(0,0,0,H);g.addColorStop(0,hexA(S.acc,.95));g.addColorStop(1,hexA(S.acc,.45));
vc.fillStyle=g;
for(let i=0;i<n;i++){const t=tgt[i],l=VL[i];VL[i]=l+(t-l)*(t>l?.55:.1);const v=VL[i];if(v>VP[i])VP[i]=v;else VP[i]=Math.max(v,VP[i]-.008);
const h=3+v*(H-8),x=i*w+2,bw=w-4;
vc.globalAlpha=.5+.5*Math.min(1,v*1.4);vc.beginPath();vc.roundRect(x,H-h,bw,h,3);vc.fill();
vc.globalAlpha=.9;vc.fillRect(x,H-h-Math.max(0,VP[i]*(H-8))-3,bw,2)}
vc.globalAlpha=1}
(function vizLoop(){try{drawViz()}catch(e){}requestAnimationFrame(vizLoop)})();

if(S.theme==='clear')S.theme='amoled';renderEQ();applyLang();renderAll();loadCustomBg();
